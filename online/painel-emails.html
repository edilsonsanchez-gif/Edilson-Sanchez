<title>Meili</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: barra de status → orbe com resumo falado à esquerda, números e gráfico à direita → lista de e-mails → letreiro */
:root{
  color-scheme:dark;
  --bg:#03070f; --bg2:#071124; --panel:rgba(10,30,60,.35); --surface:rgba(10,30,60,.55);
  --line:rgba(90,200,255,.28); --border:rgba(90,200,255,.28); --grid:rgba(90,200,255,.12);
  --cyan:#4fd8ff; --cyan-soft:#8fe6ff; --accent:#4fd8ff; --text:#d8f3ff; --text2:#6f93ad;
  --up:#3dffb0; --warn:#ffb547;
  --c-venda:#4fd8ff; --c-pergunta:#ff8a3d; --c-mensagem:#3dffb0; --c-outros:#5b7184;
  --font:"Rajdhani",-apple-system,"Segoe UI",sans-serif; --mono:"Share Tech Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse at 30% 30%,#0b2347 0%,var(--bg2) 40%,var(--bg) 100%) fixed;background-color:var(--bg);
  color:var(--text);font:16px/1.4 var(--font);overflow-x:hidden}
.mono{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
.app{max-width:1400px;margin:0 auto;padding-block:18px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:6px;flex-wrap:wrap}
.brand b{font-weight:700;font-size:30px;letter-spacing:.22em;color:var(--cyan);text-shadow:0 0 14px rgba(79,216,255,.6)}
.brand span{font-size:11px;color:var(--text2)}
.trocar{align-self:center;font-size:11px;color:var(--cyan);text-decoration:none;border:1px solid var(--cyan);padding:6px 10px;transition:background .15s,box-shadow .15s}
.trocar:hover{background:rgba(79,216,255,.12);box-shadow:0 0 14px rgba(79,216,255,.35)}
button.trocar{background:transparent;box-shadow:none;letter-spacing:.12em}
#telacheia[aria-pressed="true"]{background:rgba(79,216,255,.15)}

:fullscreen body,:-webkit-full-screen body{overflow-y:auto}
:fullscreen,:-webkit-full-screen{background:var(--bg)}
.sbar{display:flex;gap:18px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.sbar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);margin-right:6px;animation:blink 2s infinite}
.busy .sbar .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
@keyframes blink{50%{opacity:.35}}
.aviso{border:1px solid var(--warn);background:rgba(255,181,71,.08);color:var(--text);padding:12px 16px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:16px}
.progresso{height:2px;background:var(--grid);overflow:hidden}
.progresso div{height:100%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);width:0;transition:width .2s}
main{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:center}
.left{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.orbwrap{position:relative;width:min(34vw,320px);aspect-ratio:1;max-width:100%}
.orbwrap svg{position:absolute;inset:0;width:100%;height:100%}
.ring1{animation:spin 40s linear infinite;transform-origin:50% 50%}
.ring2{animation:spin 25s linear infinite reverse;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{position:absolute;inset:22%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#bff4ff 0%,#3fc6ff 22%,#1d6dff 52%,#5a2bd6 78%,#1a0b55 100%);
  box-shadow:0 0 50px rgba(63,198,255,.55),0 0 120px rgba(80,60,255,.35),inset 0 0 40px rgba(255,255,255,.25);
  animation:breathe 4s ease-in-out infinite;overflow:hidden}
.orb::after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.28),transparent 30%,rgba(140,90,255,.35),transparent 60%);animation:spin 6s linear infinite;mix-blend-mode:screen}
@keyframes breathe{50%{transform:scale(1.04)}}
.busy .orb,.falando .orb{animation:talk .45s ease-in-out infinite alternate}
#voz[aria-pressed="true"]{background:rgba(61,255,176,.12);border-color:var(--up);color:var(--up)}
@keyframes talk{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.08);filter:brightness(1.3)}}
.state{font-size:13px;color:var(--cyan);min-height:18px;text-align:center}
.caption{display:flex;gap:12px;align-items:flex-start;max-width:520px;min-height:64px}
.caption small{font-size:10px;color:var(--text2);padding-top:7px;white-space:nowrap}
.caption p{margin:0;font-size:22px;line-height:1.3;font-weight:600;color:var(--cyan-soft);text-shadow:0 0 12px rgba(79,216,255,.35)}
.right{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{border:1px solid var(--line);background:var(--panel);padding:16px 20px;position:relative;backdrop-filter:blur(4px);min-width:0}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cyan);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.ptitle{font-size:11px;color:var(--cyan);margin:0 0 14px;font-weight:400}
.ptitle::before{content:"◆ "}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{border:0;border-top:1px solid var(--line);background:transparent;color:var(--text);padding:8px 4px 6px;
  text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;font:inherit;box-shadow:none;letter-spacing:normal;text-transform:none}
.card:hover{background:rgba(79,216,255,.05)}
.card[aria-pressed="true"]{border-top:2px solid var(--cyan);background:rgba(79,216,255,.08)}
.card .rot{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2)}
.card .num{font-family:var(--mono);font-size:28px;color:var(--text);font-variant-numeric:tabular-nums}
.card .pct{font-family:var(--mono);font-size:12px;color:var(--text2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 6px currentColor}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.grafico{position:relative}
.grafico svg{width:100%;height:auto;display:block}
.grafico text{fill:var(--text2);font-size:11px;font-family:var(--mono)}
.tip{position:absolute;pointer-events:none;background:#06122a;border:1px solid var(--cyan);padding:8px 10px;font-family:var(--mono);
  font-size:12px;box-shadow:0 0 18px rgba(79,216,255,.3);white-space:nowrap;z-index:2;color:var(--text)}
.tip div{display:flex;align-items:center;gap:6px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:13px;border:1px solid var(--cyan);
  background:var(--cyan);color:#02101c;padding:10px 18px;cursor:pointer;box-shadow:0 0 18px rgba(79,216,255,.45);border-radius:0}
button.ghost{background:transparent;color:var(--cyan);box-shadow:none}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.linha:focus-visible{outline:2px solid var(--cyan-soft);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{background:transparent;color:var(--text2);border:0;box-shadow:none;padding:9px 12px;font-size:12px}
.seg button[aria-pressed="true"]{background:rgba(79,216,255,.15);color:var(--cyan)}
select,#busca{font-family:var(--mono);font-size:13px;letter-spacing:.06em;background:rgba(3,10,22,.7);color:var(--text);
  border:1px solid var(--line);padding:9px 10px;border-radius:0;max-width:100%}
#busca{flex:1 1 220px;min-width:0}
#busca::placeholder{color:var(--text2)}
.lista-topo{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}
.lista-topo .ptitle{margin:0}
.lista{display:flex;flex-direction:column}
.linha{display:grid;grid-template-columns:170px minmax(0,1fr) 210px 110px;gap:14px;align-items:start;padding:12px 8px;
  border:0;border-top:1px solid var(--grid);background:none;box-shadow:none;cursor:pointer;text-align:left;color:var(--text);width:100%;
  font:inherit;text-transform:none;letter-spacing:normal}
.linha:hover{background:rgba(79,216,255,.06)}
.linha[aria-expanded="true"]{background:rgba(79,216,255,.08)}
.cab{cursor:default;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);border-top:0;padding-block:4px}
.cab:hover{background:none}
.tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.assunto,.rem>span{display:block}
.assunto{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.trecho{color:var(--text2);font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.rem{overflow-wrap:anywhere;font-size:15px}
.sub{color:var(--text2);font-size:13px}
.quando{font-family:var(--mono);color:var(--cyan);font-size:13px;font-variant-numeric:tabular-nums}
.detalhe{padding:6px 8px 18px;display:flex;flex-direction:column;gap:12px;border-left:2px solid var(--cyan);margin-left:8px;background:rgba(79,216,255,.04)}
.detalhe .texto{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px}
.detalhe .acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.detalhe a{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--cyan)}
.motivos{font-size:14px;color:var(--text2);margin:0;padding-left:18px}
.vazio{color:var(--text2);text-align:center;padding:26px 8px;margin:0;font-size:16px}
.mais{align-self:center;margin-top:10px}
.ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:10px 0;background:rgba(3,10,22,.6)}
.track{display:inline-block;padding-left:100%;animation:scroll 90s linear infinite;font-size:17px;font-weight:600}
.track span{margin-right:28px}
.track span::after{content:"◆";color:var(--cyan);margin-left:28px}
.track b{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.1em;margin-right:8px}
@keyframes scroll{to{transform:translateX(-100%)}}
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:4px 0 16px;font-size:10px;color:var(--text2)}
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr)}
  .orbwrap{width:min(56vw,240px)}
  .caption p{font-size:19px}
  .brand b{font-size:24px}
}
@media (max-width:700px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .linha{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .linha .c-rem{display:none}
  .linha .c-tipo{grid-column:1/-1;order:-1}
  .cab{display:none}
}
@media (prefers-reduced-motion:reduce){.ring1,.ring2,.orb,.orb::after,.track,.sbar .dot{animation:none}.progresso div{transition:none}}
</style>

<div class="app" id="app">
  <header>
    <div class="brand"><b>MEILI</b><span class="mono">Central de atendimento</span><a class="trocar mono" href="https://claude.ai/artifact/VNV6YYzNRraXYkAszxz5iP" target="_blank" rel="noopener" title="Abrir o Jarbas">Ir para Jarbas ↗</a><button type="button" class="trocar mono" id="telacheia" aria-pressed="false" title="Tela cheia">⛶ Tela cheia</button></div>
    <div class="sbar mono"><span><i class="dot"></i><span id="sis">Sistema ativo</span></span><span id="auto"></span><span id="data-hoje"></span><span id="relogio">--:--:--</span></div>
  </header>

  <div class="aviso" id="aviso" hidden>
    <span id="aviso-texto"></span>
    <button type="button" class="ghost" id="aviso-botao" hidden></button>
  </div>
  <div class="progresso" id="progresso" hidden><div></div></div>

  <main>
    <div class="left">
      <div class="orbwrap" aria-hidden="true">
        <svg viewBox="0 0 200 200">
          <g class="ring1"><circle cx="100" cy="100" r="96" fill="none" stroke="rgba(90,200,255,.25)" stroke-width=".6" stroke-dasharray="1 3"/></g>
          <g class="ring2"><circle cx="100" cy="100" r="86" fill="none" stroke="rgba(90,210,255,.55)" stroke-width="1" stroke-dasharray="40 12 4 12"/></g>
          <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(90,200,255,.18)" stroke-width=".6"/>
          <g stroke="rgba(120,220,255,.7)" stroke-width="1.2"><line x1="100" y1="0" x2="100" y2="8"/><line x1="100" y1="192" x2="100" y2="200"/><line x1="0" y1="100" x2="8" y2="100"/><line x1="192" y1="100" x2="200" y2="100"/></g>
        </svg>
        <div class="orb"></div>
      </div>
      <div class="state mono" id="status">Conectando ao Gmail…</div>
      <div class="caption"><small class="mono">Meili</small><p id="caption">Lendo a sua caixa de entrada.</p></div>
    </div>

    <div class="right">
      <section class="panel" id="sec-resumo">
        <h2 class="ptitle mono">Resumo · <span id="per-rot">7 dias</span></h2>
        <div class="cards" id="cards"></div>

      <section class="panel" id="sec-grafico">
        <h2 class="ptitle mono">E-mails por dia</h2>

          <button type="button" data-periodo="7" aria-pressed="true">7 dias</button>

          <button type="button" data-periodo="30" aria-pressed="false">30 dias</button>

        <button type="button" id="atualizar">Atualizar</button>

  </main>

  <section class="panel" id="sec-lista">

      <h2 class="ptitle mono" id="titulo-lista">Todos os e-mails</h2>
      <input id="busca" type="search" placeholder="Buscar assunto, remetente ou texto" aria-label="Buscar">
    </div>
    <div class="lista" id="lista"></div>
    <button type="button" class="ghost mais" id="mais" hidden>Mostrar mais</button>
  </section>

  <div class="ticker" aria-label="Últimos e-mails"><div class="track" id="track"></div></div>
  <footer class="mono"><span>Fonte: Gmail · somente leitura</span><span>Clique num e-mail para corrigir o tipo · salvo só para você</span></footer>
</div>

<script>
(function () {
  "use strict";

  // ---------- Regras de classificação (mesmas do app local, regras.json) ----------
  var ORDEM = ["venda", "pergunta", "mensagem", "outros"];
  var CATS = {
    venda: { rotulo: "Venda de produto", palavras: [
      "nova venda","venda realizada","venda aprovada","voce vendeu","pedido","novo pedido","pedido confirmado",
      "pedido realizado","compra aprovada","compra confirmada","compra realizada","pagamento aprovado",
      "pagamento confirmado","pagamento recebido","pix recebido","transacao aprovada","comprovante de pagamento",
      "nota fiscal","nf-e","boleto pago","checkout","order","new order","payment received","purchase",
      "vendeu","voce fez uma venda","fez uma venda","venda concretizada","nova venda no mercado livre","prepare o pacote",
      "imprima a etiqueta","imprimir a etiqueta","despache","envie o produto","pagamento creditado","dinheiro disponivel"] },
    pergunta: { rotulo: "Pergunta de cliente", palavras: [
      "duvida","pergunta","gostaria de saber","queria saber","como faco","como funciona","quanto custa",
      "qual o valor","qual o preco","qual o prazo","tem disponivel","tem em estoque","voces entregam",
      "voces tem","poderia me informar","pode me informar","poderiam me","orcamento","informacao",
      "informacoes","e possivel","consigo","aceita","parcela",
      "te fizeram uma pergunta","recebeu uma pergunta","nova pergunta","responda a pergunta","perguntou"] },
    mensagem: { rotulo: "Mensagem de cliente", palavras: [
      "obrigado","obrigada","agradeco","parabens","elogio","reclamacao","problema","nao recebi","atraso",
      "troca","devolucao","cancelar","cancelamento","feedback","recebi o produto","meu pedido","minha compra",
      "minha encomenda","rastreio","defeito",
      "mensagem do comprador","mensagem de comprador","nova mensagem","te enviou uma mensagem","enviou uma mensagem",
      "enviou mensagens","enviou mensagem","mensagens para voce","mensagem para voce",
      "reclamacao aberta","abriu uma reclamacao","mediacao","pos-venda"] },
    outros: { rotulo: "Outros avisos", palavras: [
      "descadastrar","cancelar inscricao","unsubscribe","newsletter","nao responda","no-reply","noreply",
      "alerta de seguranca","verifique seu e-mail","codigo de verificacao","seu codigo","verification code",
      "security alert","验证码"] }
  };
  var DESEMPATE = ["mensagem", "pergunta", "venda", "outros"];
  var AUTOMATICO = /no-?reply|nao-?responda|newsletter|news@|noticias|novidades|comunicacao|marketing|campanha|relacionamento|ofertas|promo|mailer|bounce|notifica/;
  var MARKETPLACE = /mercadoli(vre|bre)|mercadopago|shopee|magalu|magazineluiza|americanas|amazon|nuvemshop|shopify|hotmart|kiwify|elo7|olx/;
  var SAUDACOES = ["tudo bem?", "tudo bom?", "como vai?", "como voce esta?", "tudo certo?"];
  var ROTULOS_AUTOMATICOS = { CATEGORY_PROMOTIONS: "Promoções", CATEGORY_SOCIAL: "Social", CATEGORY_FORUMS: "Fóruns" };

  function normalizar(t) {
    return String(t || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  }
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  var PADROES = {};
  ORDEM.forEach(function (c) {
    PADROES[c] = CATS[c].palavras.map(function (p) {
      return { p: p, re: new RegExp("(?<![a-z0-9])" + escRe(normalizar(p)) + "(?![a-z0-9])") };
    });
  });

  function classificar(assunto, texto, remetente, labels) {
    var a = normalizar(assunto), t = normalizar(texto), r = normalizar(remetente);
    var pts = { venda: 0, pergunta: 0, mensagem: 0, outros: 0 }, motivos = [];
    ORDEM.forEach(function (c) {
      PADROES[c].forEach(function (x) {
        if (x.re.test(a)) { pts[c] += 2; motivos.push("“" + x.p + "” no assunto"); }
        else if (x.re.test(t)) { pts[c] += 1; motivos.push("“" + x.p + "” no texto"); }
        else if (c === "outros" && x.re.test(r)) { pts[c] += 1; motivos.push("“" + x.p + "” no remetente"); }
      });
    });
    var trecho = a + " " + t;
    SAUDACOES.forEach(function (s) { trecho = trecho.split(s).join(" "); });
    if (trecho.indexOf("?") >= 0) { pts.pergunta += 2; motivos.push("contém um “?”"); }
    (labels || []).forEach(function (l) {
      if (ROTULOS_AUTOMATICOS[l]) { pts.outros += 2; motivos.push("aba " + ROTULOS_AUTOMATICOS[l] + " do Gmail"); }
    });
    if (pts.venda > 0) pts.outros = 0; // venda enviada por no-reply continua sendo venda
    // Avisos de marketplace (Mercado Livre, Shopee...) chegam de no-reply e na aba Atualizações:
    // se trazem venda, pergunta ou mensagem, não são "outros".
    if (MARKETPLACE.test(r) && (pts.venda || pts.pergunta || pts.mensagem)) { pts.outros = 0; motivos.push("aviso de marketplace"); }
    var melhor = DESEMPATE.slice().sort(function (x, y) { return pts[y] - pts[x] || DESEMPATE.indexOf(x) - DESEMPATE.indexOf(y); })[0];
    if (pts[melhor] === 0) {
      // Sem palavra-chave: e-mail automático (abas Promoções/Atualizações/Social ou remetente de envio em massa) vira "outros";
      // e-mail de pessoa, na aba Principal, vira mensagem de cliente.
      var automatico = (labels || []).some(function (l) { return /^CATEGORY_(PROMOTIONS|UPDATES|SOCIAL|FORUMS)$/.test(l); }) || AUTOMATICO.test(r);
      melhor = automatico ? "outros" : "mensagem";
      motivos.push(automatico ? "nenhuma palavra-chave e parece envio automático" : "nenhuma palavra-chave: tipo padrão");
    }
    return { cat: melhor, motivos: motivos };
  }

  // ---------- Estado ----------
  var estado = {
    periodo: 7, filtro: null, busca: "", conta: "", aberto: null, limite: 60,
    itens: new Map(), correcoes: new Map(), carregando: false, feitos: 0, total: 0,
    ultima: null, geracao: 0
  };
  var mcp = null, db = null, uid = null;
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, attrs, filhos) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "class") e.className = attrs[k];
      else if (k === "style") e.setAttribute("style", attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }
  function dot(c) { return el("span", { class: "dot", style: "background:var(--c-" + c + ")" }); }
  function catDe(it) { return estado.correcoes.get(it.threadId) || it.auto.cat; }
  function linkSeguro(u) { return typeof u === "string" && /^https:\/\//.test(u) ? u : null; }
  function diaISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmtData(d) {
    if (!d || isNaN(d)) return "";
    var hoje = diaISO(new Date()) === diaISO(d);
    var hora = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    return hoje ? "hoje " + hora : String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + " " + hora;
  }

  // ---------- Avisos ----------
  function aviso(texto, botao, acao) {
    $("aviso").hidden = !texto;
    $("aviso-texto").textContent = texto || "";
    var b = $("aviso-botao");
    b.hidden = !botao;
    if (botao) { b.textContent = botao; b.onclick = acao; }
  }
  var FATAIS = {
    server_not_connected: ["O Gmail não está conectado à sua conta Claude. Conecte em claude.ai → Configurações → Conectores e depois clique em Tentar de novo.", "Tentar de novo"],
    needs_reauth: ["A conexão com o Gmail expirou. Reconecte o Gmail em claude.ai → Configurações → Conectores e depois clique em Tentar de novo.", "Tentar de novo"],
    selection_required: ["Você tem mais de uma conta Gmail conectada. Escolha qual usar no aviso do Claude e depois clique em Tentar de novo.", "Tentar de novo"],
    approval_required: ["O painel precisa da sua permissão para ler o Gmail.", "Permitir acesso ao Gmail"],
    not_in_manifest: ["O acesso ao Gmail foi recusado para este painel. Permita no menu Permissões do artefato e depois clique em Tentar de novo.", "Tentar de novo"],
    consent_required: ["O painel precisa da sua permissão para ler o Gmail.", "Permitir acesso ao Gmail"],
    blocked_by_policy: ["A sua organização bloqueou o acesso ao Gmail por aqui.", null],
    not_granted: ["Este painel só lê o Gmail quando aberto no claude.ai, com a sua conta.", null],
    capability_disabled: ["Este painel só lê o Gmail quando aberto no claude.ai, com a sua conta.", null],
    capability_removed: ["Este painel só lê o Gmail quando aberto no claude.ai, com a sua conta.", null]
  };

  // ---------- Chamadas ao Gmail ----------
  function payloadDe(res) {
    var p = res && res.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { p = null; } }
    return p || {};
  }
  function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function chamar(tool, input, cache) {
    return mcp.callTool("Gmail", tool, input, { cache: cache }).catch(function (e) {
      if (e && e.retryable) {
        return esperar((e.retryAfterMs || 800) + Math.random() * 700).then(function () {
          return mcp.callTool("Gmail", tool, input, { cache: cache });
        });
      }
      throw e;
    });
  }
  function pool(itens, n, fn) {
    var i = 0;
    function prox() { if (i >= itens.length) return Promise.resolve(); var x = itens[i++]; return fn(x).then(prox); }
    var ps = []; for (var k = 0; k < Math.min(n, itens.length); k++) ps.push(prox());
    return Promise.all(ps);
  }

  var DIA = 86400000, SEMANA = 7 * DIA;

  function montarItem(x, msg) {
    var m = x.m;
    msg = msg || {};
    var email = msg.sender || m.sender || "";
    var nome = email;
    (msg.addressDisplayNames || []).forEach(function (a) { if (a && a.emailAddress === email && a.displayName) nome = a.displayName; });
    var data = msg.date ? new Date(msg.date) : (msg.internalDate ? new Date(Number(msg.internalDate)) : new Date(x.dia.getTime() + 12 * 3600000));
    var assunto = msg.subject || m.subject || "(sem assunto)";
    var trecho = msg.snippet || m.snippet || "";
    var labels = msg.labelIds || m.labelIds || [];
    var para = (msg.toRecipients || m.toRecipients || [])[0];
    var conta = typeof para === "string" ? para.trim().toLowerCase() : "";
    return {
      threadId: x.t.id, msgId: msg.id || m.id, assunto: assunto, remetente: nome, email: email,
      data: data, trecho: trecho, count: x.t.messageCount || 1, conta: conta,
      url: linkSeguro(msg.viewUrl) || linkSeguro(x.t.viewUrl) || linkSeguro(m.viewUrl) ||
           "https://mail.google.com/mail/#all/" + encodeURIComponent(x.t.id),
      auto: classificar(assunto, trecho, email, labels)
    };
  }

  // ---------- Busca automática a cada minuto ----------
  var INTERVALO = 60000, proxima = 0, verificando = false;
  function fmtQ(d) { return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate(); }
  var ultimaBusca = 0;
  function verificarNovos() {
    proxima = Date.now() + INTERVALO;
    ultimaBusca = Date.now();
    if (!mcp || estado.carregando || verificando || !estado.ultima) return;
    verificando = true;
    var ger = estado.geracao;
    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    var query = "in:inbox after:" + fmtQ(hoje) + " before:" + fmtQ(new Date(hoje.getTime() + DIA));
    chamar("search_threads", { query: query, pageSize: 50, view: "THREAD_VIEW_MINIMAL" }, { staleTime: 0, gcTime: DIA, refresh: true })
      .then(function (res) {
        var p = payloadDe(res);
        var novos = (Array.isArray(p.threads) ? p.threads : []).filter(function (t) { return t && t.id && !estado.itens.has(t.id); });
        return pool(novos, 3, function (t) {
          var m = Array.isArray(t.messages) && t.messages[0] ? t.messages[0] : {};
          var x = { t: t, m: m, dia: hoje };
          var pr = m.date && m.snippet != null ? Promise.resolve(m)
            : chamar("get_message", { messageId: m.id || t.id, messageFormat: "MINIMAL" }, { staleTime: SEMANA, gcTime: SEMANA }).then(payloadDe).catch(function () { return m; });
          return pr.then(function (msg) { x.item = montarItem(x, msg); t._x = x; });
        }).then(function () {
          if (ger !== estado.geracao || estado.carregando) return;
          var chegaram = [];
          novos.forEach(function (t) {
            if (!t._x || estado.itens.has(t.id)) return;
            estado.itens.set(t.id, t._x.item);
            chegaram.push(t._x.item);
          });
          estado.ultima = new Date();
          if (chegaram.length) anunciar(chegaram);
          render();
        });
      })
      .catch(function (e) {
        var code = e && e.code;
        if (FATAIS[code]) { var f = FATAIS[code]; aviso(f[0], f[1], function () { carregar(true); }); }
      })
      .then(function () { verificando = false; });
  }

  // ---------- Avisos de voz ----------
  var tts = null, vozLigada = false, falaPendente = null, ultimoAviso = null;
  // modo: "claude" (voz do Claude), "navegador" (voz do próprio navegador), "negada", "nenhuma" ou "" (verificando)
  var modoVoz = "", permissoes = null;
  var temVozNavegador = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
  function vozNavegador(texto, depois) {
    try {
      var u = new SpeechSynthesisUtterance(texto);
      u.lang = "pt-BR";
      var vs = window.speechSynthesis.getVoices() || [];
      var pt = vs.filter(function (v) { return /^pt(-|_)BR/i.test(v.lang); })[0] || vs.filter(function (v) { return /^pt/i.test(v.lang); })[0];
      if (pt) u.voice = pt;
      u.onstart = function () { $("app").classList.add("falando"); };
      u.onend = u.onerror = function () { $("app").classList.remove("falando"); };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  try { vozLigada = localStorage.getItem("meili-voz") === "1"; } catch (e) {}
  var FRASE = {
    venda: ["uma venda", "vendas"],
    pergunta: ["uma pergunta de cliente", "perguntas de clientes"],
    mensagem: ["uma mensagem de comprador", "mensagens de compradores"]
  };
  function anunciar(itens) {
    var imp = itens.filter(function (it) { return catDe(it) !== "outros"; });
    if (!imp.length) return;
    var texto;
    if (imp.length === 1) {
      var it = imp[0], a = it.assunto.length > 90 ? it.assunto.slice(0, 90) + "…" : it.assunto;
      texto = "Chegou " + FRASE[catDe(it)][0] + ": " + a + ".";
    } else {
      var n = { venda: 0, pergunta: 0, mensagem: 0 };
      imp.forEach(function (it) { n[catDe(it)]++; });
      var partes = ["venda", "pergunta", "mensagem"].filter(function (c) { return n[c]; }).map(function (c) {
        return n[c] === 1 ? FRASE[c][0] : n[c] + " " + FRASE[c][1];
      });
      texto = "Chegaram " + (partes.length > 1 ? partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1] : partes[0]) + ".";
    }
    ultimoAviso = { texto: texto, em: Date.now() };
    falar(texto);
  }
  function falar(texto) {
    if (!vozLigada || (modoVoz !== "claude" && modoVoz !== "navegador")) return;
    if (document.hidden) { falaPendente = texto; return; }
    falaPendente = null;
    if (modoVoz === "navegador") { vozNavegador(texto); return; }
    tts.speak(texto, { language: "pt-BR" }).catch(function (e) {
      var code = e && e.code;
      if (code === "no_gesture") falaPendente = texto;
      else if (code === "not_granted") { modoVoz = "negada"; atualizarBotaoVoz(); }
      else if (code === "unavailable" && temVozNavegador) { modoVoz = "navegador"; vozNavegador(texto); }
    });
  }
  function atualizarBotaoVoz() {
    var b = $("voz");
    b.disabled = modoVoz === "nenhuma";
    if (modoVoz === "negada") { b.setAttribute("aria-pressed", "false"); b.textContent = "Voz bloqueada: permitir"; return; }
    if (modoVoz === "nenhuma") { b.setAttribute("aria-pressed", "false"); b.textContent = "Voz indisponível aqui"; return; }
    b.setAttribute("aria-pressed", vozLigada ? "true" : "false");
    b.textContent = vozLigada ? "Voz ligada" : "Ligar avisos de voz";
  }
  var CONFIRMA = "Avisos de voz ligados. Vou avisar quando chegar venda, pergunta ou mensagem de comprador.";
  $("voz").addEventListener("click", function () {
    if (modoVoz === "negada") {
      if (permissoes && permissoes.manage) permissoes.manage().then(iniciarVoz, function () {
        aviso("Para ligar a voz, abra o menu Permissões deste artefato e permita a leitura em voz alta.", null);
      });
      return;
    }
    vozLigada = !vozLigada;
    try { localStorage.setItem("meili-voz", vozLigada ? "1" : "0"); } catch (e) {}
    atualizarBotaoVoz();
    if (!vozLigada) {
      if (modoVoz === "claude") tts.stop().catch(function () {});
      if (modoVoz === "navegador") window.speechSynthesis.cancel();
      return;
    }
    if (modoVoz === "navegador") { vozNavegador(CONFIRMA); return; }
    if (modoVoz === "claude") {
      tts.speak(CONFIRMA, { language: "pt-BR" }).catch(function (e) {
        var code = e && e.code;
        if (code === "not_granted") { modoVoz = "negada"; atualizarBotaoVoz(); }
        else if (code === "unavailable" && temVozNavegador) { modoVoz = "navegador"; vozNavegador(CONFIRMA); }
      });
    }
  });
  document.addEventListener("pointerdown", function () { if (falaPendente) falar(falaPendente); }, true);
  document.addEventListener("keydown", function () { if (falaPendente) falar(falaPendente); }, true);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && falaPendente) falar(falaPendente);
    if (!document.hidden && Date.now() > proxima) verificarNovos();
  });

  function carregar(forcar) {
    if (!mcp) return;
    var ger = ++estado.geracao;
    estado.carregando = true; estado.feitos = 0; estado.total = 0;
    aviso(null);
    $("atualizar").disabled = true;
    renderStatus();
    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    var dias = [];
    for (var i = 0; i < estado.periodo; i++) dias.push(new Date(hoje.getTime() - i * DIA));
    var fatal = null, vistos = new Set(), falhas = 0;
    var fmt = function (d) { return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate(); };
    estado.total = dias.length;

    function tratarErro(e) {
      var code = e && e.code;
      if (FATAIS[code] && !fatal) fatal = code;
      else falhas++;
    }

    function buscarDia(d, idx) {
      if (fatal || ger !== estado.geracao) return Promise.resolve();
      var query = "in:inbox after:" + fmt(d) + " before:" + fmt(new Date(d.getTime() + DIA));
      var cache = idx === 0 ? { staleTime: forcar ? 0 : 120000, gcTime: DIA, refresh: !!forcar }
                            : { staleTime: forcar && idx === 1 ? 0 : 6 * 3600000, gcTime: SEMANA };
      var paginas = 0;
      function pagina(token) {
        var input = { query: query, pageSize: 50, view: "THREAD_VIEW_MINIMAL" };
        if (token) input.pageToken = token;
        return chamar("search_threads", input, cache).then(function (res) {
          if (ger !== estado.geracao) return;
          var p = payloadDe(res);
          var threads = Array.isArray(p.threads) ? p.threads : [];
          var novos = [];
          threads.forEach(function (t) {
            if (!t || !t.id || vistos.has(t.id)) return;
            vistos.add(t.id);
            var m = Array.isArray(t.messages) && t.messages[0] ? t.messages[0] : {};
            novos.push({ t: t, m: m, dia: d });
          });
          estado.total += novos.length;
          return pool(novos, 4, detalhar).then(function () {
            paginas++;
            if (p.nextPageToken && paginas < 6 && !fatal) return pagina(p.nextPageToken);
          });
        });
      }
      return pagina(null).catch(tratarErro).then(function () { estado.feitos++; agendar(); });
    }

    function detalhar(x) {
      if (fatal || ger !== estado.geracao) return Promise.resolve();
      var m = x.m;
      var pronto = m.date && m.snippet != null;
      var p = pronto ? Promise.resolve(m)
        : chamar("get_message", { messageId: m.id || x.t.id, messageFormat: "MINIMAL" }, { staleTime: SEMANA, gcTime: SEMANA })
            .then(payloadDe).catch(function (e) { tratarErro(e); return m; });
      return p.then(function (msg) {
        if (ger !== estado.geracao) return;
        estado.itens.set(x.t.id, montarItem(x, msg));
        estado.feitos++;
        agendar();
      });
    }

    estado.itens = new Map();
    estado.limite = 60;
    agendar();
    pool(dias.map(function (d, i) { return [d, i]; }), 3, function (a) { return buscarDia(a[0], a[1]); }).then(function () {
      if (ger !== estado.geracao) return;
      estado.carregando = false;
      $("atualizar").disabled = false;
      if (fatal) {
        var f = FATAIS[fatal];
        aviso(f[0], f[1], function () { carregar(true); });
      } else if (falhas) {
        aviso("Alguns e-mails não puderam ser lidos agora (" + falhas + "). O painel mostra o restante.", "Tentar de novo", function () { carregar(true); });
      }
      if (!fatal) estado.ultima = new Date();
      proxima = Date.now() + INTERVALO;
      render();
    });
  }

  // ---------- Correções (salvas só para quem está vendo) ----------
  function iniciarCorrecoes() {
    if (!db || !uid) return;
    try {
      db.collection("data/users/" + uid + "/correcoes").onSnapshot(function (snap) {
        var m = new Map();
        snap.docs.forEach(function (d) {
          var v = d.data() || {};
          if (CATS[v.categoria]) m.set(d.id, v.categoria);
        });
        estado.correcoes = m;
        agendar();
      }, function () { /* sem correções: segue com a classificação automática */ });
    } catch (e) { /* idem */ }
  }
  function salvarCorrecao(threadId, cat, botao) {
    if (!db || !uid) return;
    var ref = db.collection("data/users/" + uid + "/correcoes").doc(threadId);
    botao.disabled = true;
    var p = cat ? ref.set({ categoria: cat, em: new Date().toISOString() }) : ref.delete();
    p.then(function () {
      if (cat) estado.correcoes.set(threadId, cat); else estado.correcoes.delete(threadId);
      render();
    }).catch(function () {
      botao.disabled = false;
      aviso("Não foi possível salvar a correção. Tente de novo em instantes.", null);
    });
  }

  // ---------- Desenho ----------
  var pendente = false;
  function agendar() { if (!pendente) { pendente = true; requestAnimationFrame(function () { pendente = false; render(); }); } }

  function visiveis() {
    var b = normalizar(estado.busca);
    var out = [];
    estado.itens.forEach(function (it) {
      if (estado.conta && it.conta !== estado.conta) return;
      if (b && normalizar(it.assunto + " " + it.remetente + " " + it.email + " " + it.trecho).indexOf(b) < 0) return;
      out.push(it);
    });
    return out;
  }

  function renderStatus() {
    var s;
    if (!mcp) s = "Conectando ao Gmail…";
    else if (estado.carregando) s = "Lendo a caixa de entrada… " + estado.itens.size + " e-mails";
    else s = "Em espera" + (estado.ultima ? " · atualizado " + fmtData(estado.ultima) : "");
    $("status").textContent = s;
    $("app").classList.toggle("busy", !!estado.carregando);
    $("sis").textContent = estado.carregando ? "Sincronizando" : (mcp ? "Sistema ativo" : "Aguardando Gmail");
    $("per-rot").textContent = estado.periodo + " dias";
    var pr = $("progresso");
    pr.hidden = !estado.carregando;
    var frac = estado.total ? Math.min(1, estado.feitos / (estado.total + estado.periodo)) : 0;
    pr.firstElementChild.style.width = Math.round(frac * 100) + "%";
  }

  function renderContas() {
    var cont = new Map();
    estado.itens.forEach(function (it) { if (it.conta) cont.set(it.conta, (cont.get(it.conta) || 0) + 1); });
    var lista = Array.from(cont.entries()).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 12);
    var sel = $("conta");
    sel.hidden = lista.length < 2 && !estado.conta;
    if (sel.hidden) return;
    var chave = lista.map(function (x) { return x[0] + x[1]; }).join("|") + "#" + estado.conta;
    if (sel.getAttribute("data-chave") === chave) return;
    sel.setAttribute("data-chave", chave);
    sel.textContent = "";
    sel.appendChild(el("option", { value: "", text: "Todas as contas" }));
    lista.forEach(function (x) { sel.appendChild(el("option", { value: x[0], text: x[0] + " (" + x[1] + ")" })); });
    if (estado.conta && !cont.has(estado.conta)) sel.appendChild(el("option", { value: estado.conta, text: estado.conta }));
    sel.value = estado.conta;
  }

  function render() {
    renderStatus();
    renderContas();
    var base = visiveis();
    var cont = { venda: 0, pergunta: 0, mensagem: 0, outros: 0 };
    base.forEach(function (it) { cont[catDe(it)]++; });
    var total = base.length;

    var cards = $("cards"); cards.textContent = "";
    ORDEM.forEach(function (c) {
      var on = estado.filtro === c;
      var b = el("button", { type: "button", class: "card", "aria-pressed": on ? "true" : "false", id: "card-" + c }, [
        el("span", { class: "rot" }, [dot(c), CATS[c].rotulo]),
        el("span", { class: "num", text: String(cont[c]) }),
        el("span", { class: "pct", text: total ? Math.round(100 * cont[c] / total) + "% do total" : "—" })
      ]);
      b.onclick = function () { estado.filtro = on ? null : c; estado.aberto = null; estado.limite = 60; render(); };
      cards.appendChild(b);
    });

    renderGrafico(base);
    renderCaption(base);
    renderTicker(base);

    var lista = base.filter(function (it) { return !estado.filtro || catDe(it) === estado.filtro; })
      .sort(function (a, b) { return b.data - a.data; });
    $("titulo-lista").textContent = (estado.filtro ? CATS[estado.filtro].rotulo : "Todos os e-mails") + " (" + lista.length + ")";
    var box = $("lista"); box.textContent = "";
    if (!lista.length) {
      box.appendChild(el("p", { class: "vazio", text: estado.carregando ? "Carregando e-mails…" :
        (mcp ? "Nenhum e-mail encontrado com esses filtros." : "Os e-mails aparecem aqui assim que o Gmail responder.") }));
    } else {
      box.appendChild(el("div", { class: "linha cab", "aria-hidden": "true" }, [
        el("span", { text: "Tipo" }), el("span", { text: "Assunto" }), el("span", { class: "c-rem", text: "Remetente" }), el("span", { text: "Recebido" })]));
      lista.slice(0, estado.limite).forEach(function (it) { box.appendChild(linha(it)); });
    }
    $("mais").hidden = lista.length <= estado.limite;
  }

  function plural(n, um, varios) { return n + " " + (n === 1 ? um : varios); }
  function renderCaption(base) {
    var p = $("caption");
    if (!mcp) { p.textContent = "Aguardando a conexão com o Gmail."; return; }
    if (estado.carregando && !base.length) { p.textContent = "Lendo a sua caixa de entrada."; return; }
    if (ultimoAviso && Date.now() - ultimoAviso.em < 180000) { p.textContent = ultimoAviso.texto; return; }
    var hoje = diaISO(new Date()), c = { venda: 0, pergunta: 0, mensagem: 0 };
    base.forEach(function (it) { if (diaISO(it.data) === hoje && c[catDe(it)] !== undefined) c[catDe(it)]++; });
    var partes = [];
    if (c.venda) partes.push(plural(c.venda, "venda", "vendas"));
    if (c.pergunta) partes.push(plural(c.pergunta, "pergunta de cliente", "perguntas de clientes"));
    if (c.mensagem) partes.push(plural(c.mensagem, "mensagem de cliente", "mensagens de clientes"));
    if (!partes.length) { p.textContent = "Nenhuma venda, pergunta ou mensagem de cliente hoje até agora."; return; }
    var txt = partes.length > 1 ? partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1] : partes[0];
    p.textContent = "Hoje chegaram " + txt + ".";
  }
  var ultimoTicker = "";
  function renderTicker(base) {
    var ult = base.filter(function (it) { return catDe(it) !== "outros"; })
      .sort(function (a, b) { return b.data - a.data; }).slice(0, 12);
    var chave = ult.map(function (it) { return it.threadId + catDe(it); }).join("|");
    if (chave === ultimoTicker) return;
    ultimoTicker = chave;
    var t = $("track"); t.textContent = "";
    if (!ult.length) { t.appendChild(el("span", { text: estado.carregando ? "Sincronizando com o Gmail" : "Sem vendas, perguntas ou mensagens no período" })); return; }
    ult.forEach(function (it) {
      var c = catDe(it);
      t.appendChild(el("span", {}, [el("b", { style: "color:var(--c-" + c + ")", text: CATS[c].rotulo.split(" ")[0] }), it.assunto]));
    });
  }

  function linha(it) {
    var c = catDe(it), aberto = estado.aberto === it.threadId;
    var frag = document.createDocumentFragment();
    var b = el("button", { type: "button", class: "linha", "aria-expanded": aberto ? "true" : "false" }, [
      el("span", { class: "tag c-tipo" }, [dot(c), CATS[c].rotulo + (estado.correcoes.has(it.threadId) ? " ✎" : "")]),
      el("span", {}, [
        el("span", { class: "assunto", text: it.assunto + (it.count > 1 ? "  (" + it.count + ")" : "") }),
        el("span", { class: "trecho", text: it.trecho })
      ]),
      el("span", { class: "rem c-rem" }, [el("span", { text: it.remetente }), it.remetente !== it.email ? el("span", { class: "sub", text: it.email }) : null]),
      el("span", { class: "quando", text: fmtData(it.data) })
    ]);
    b.onclick = function () { estado.aberto = aberto ? null : it.threadId; render(); };
    frag.appendChild(b);
    if (aberto) frag.appendChild(detalhe(it));
    return frag;
  }

  function detalhe(it) {
    var c = catDe(it);
    var d = el("div", { class: "detalhe" });
    d.appendChild(el("div", { class: "sub", text: "De " + it.remetente + (it.email && it.email !== it.remetente ? " <" + it.email + ">" : "") + " · " + fmtData(it.data) }));
    if (it.trecho) d.appendChild(el("div", { class: "texto", text: it.trecho + (it.trecho.length >= 150 ? "…" : "") }));
    var acoes = el("div", { class: "acoes" });
    acoes.appendChild(el("a", { href: it.url, target: "_blank", rel: "noopener", text: "Abrir no Gmail ↗" }));
    if (db && uid) {
      var sel = el("select", { id: "tipo-" + it.threadId, "aria-label": "Tipo do e-mail" });
      ORDEM.forEach(function (k) { var o = el("option", { value: k, text: CATS[k].rotulo }); if (k === c) o.selected = true; sel.appendChild(o); });
      var salvar = el("button", { type: "button", text: "Salvar tipo" });
      salvar.onclick = function () { salvarCorrecao(it.threadId, sel.value === it.auto.cat ? null : sel.value, salvar); };
      acoes.appendChild(sel); acoes.appendChild(salvar);
      if (estado.correcoes.has(it.threadId)) {
        var volta = el("button", { type: "button", class: "ghost", text: "Voltar ao automático" });
        volta.onclick = function () { salvarCorrecao(it.threadId, null, volta); };
        acoes.appendChild(volta);
      }
    }
    d.appendChild(acoes);
    var ul = el("ul", { class: "motivos" });
    ul.appendChild(el("li", { text: "Classificação automática: " + CATS[it.auto.cat].rotulo }));
    it.auto.motivos.slice(0, 6).forEach(function (m) { ul.appendChild(el("li", { text: m })); });
    d.appendChild(ul);
    return d;
  }

  var SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) { var e = document.createElementNS(SVGNS, tag); Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); }); return e; }

  function renderGrafico(base) {
    var leg = $("legenda"); leg.textContent = "";
    ORDEM.forEach(function (c) { leg.appendChild(el("span", {}, [dot(c), CATS[c].rotulo])); });
    var box = $("grafico"), tip = $("tip");
    Array.prototype.slice.call(box.querySelectorAll("svg, .vazio")).forEach(function (n) { n.remove(); });
    tip.hidden = true;

    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    var dias = [];
    for (var i = estado.periodo - 1; i >= 0; i--) dias.push(diaISO(new Date(hoje.getTime() - i * DIA)));
    var dados = {};
    dias.forEach(function (d) { dados[d] = { venda: 0, pergunta: 0, mensagem: 0, outros: 0 }; });
    base.forEach(function (it) { var k = diaISO(it.data); if (dados[k]) dados[k][catDe(it)]++; });
    var maximo = 0; dias.forEach(function (d) { var t = 0; ORDEM.forEach(function (c) { t += dados[d][c]; }); maximo = Math.max(maximo, t); });
    if (!maximo) { box.insertBefore(el("p", { class: "vazio", text: estado.carregando ? "Carregando…" : "Sem e-mails no período." }), tip); return; }

    var larg = Math.max(300, Math.round(box.clientWidth || 900)), alt = larg < 500 ? 200 : 220, esq = 34, baseY = 196, topo = 10, hUtil = baseY - topo;
    var passo = Math.max(1, Math.ceil(maximo / 4)), eixo = passo * 4;
    var col = (larg - esq) / dias.length, barra = Math.max(3, Math.min(30, col * 0.66));
    var aCadaMin = larg < 500 ? 6 : 10;
    var svg = s("svg", { viewBox: "0 0 " + larg + " " + alt, role: "img", "aria-label": "E-mails por dia, separados por tipo" });
    for (var g = 0; g <= 4; g++) {
      var y = baseY - hUtil * g / 4;
      svg.appendChild(s("line", { x1: esq, x2: larg, y1: y, y2: y, stroke: "var(--grid)" }));
      var tx = s("text", { x: esq - 6, y: y + 4, "text-anchor": "end" }); tx.textContent = String(passo * g); svg.appendChild(tx);
    }
    var aCada = Math.max(1, Math.ceil(dias.length / aCadaMin));
    dias.forEach(function (dia, idx) {
      var cx = esq + col * idx + col / 2, yy = baseY, v = dados[dia];
      var segs = ORDEM.filter(function (c) { return v[c]; });
      segs.forEach(function (c, j) {
        var h = hUtil * v[c] / eixo, gap = j > 0 ? 2 : 0, t0 = yy - h, x0 = cx - barra / 2;
        var r = j === segs.length - 1 ? Math.min(4, barra / 2, h - gap) : 0;
        var path = "M" + x0 + "," + (yy - gap) + " V" + (t0 + r) + " Q" + x0 + "," + t0 + " " + (x0 + r) + "," + t0 +
          " H" + (x0 + barra - r) + " Q" + (x0 + barra) + "," + t0 + " " + (x0 + barra) + "," + (t0 + r) + " V" + (yy - gap) + " Z";
        svg.appendChild(s("path", { d: path, fill: "var(--c-" + c + ")" }));
        yy = t0;
      });
      var alvo = s("rect", { x: esq + col * idx, y: topo, width: col, height: hUtil, fill: "transparent" });
      alvo.addEventListener("mousemove", function (ev) {
        tip.textContent = "";
        var p = dia.split("-");
        tip.appendChild(el("b", { text: p[2] + "/" + p[1] + "/" + p[0] }));
        ORDEM.forEach(function (c) { tip.appendChild(el("div", {}, [dot(c), CATS[c].rotulo + ": ", el("b", { text: String(v[c]) })])); });
        tip.hidden = false;
        var rb = box.getBoundingClientRect(), x = ev.clientX - rb.left + 12, yv = ev.clientY - rb.top + 12;
        if (x + tip.offsetWidth > rb.width) x = ev.clientX - rb.left - tip.offsetWidth - 12;
        tip.style.left = Math.max(0, x) + "px"; tip.style.top = yv + "px";
      });
      alvo.addEventListener("mouseleave", function () { tip.hidden = true; });
      svg.appendChild(alvo);
      if (idx % aCada === 0) {
        var p = dia.split("-"), lt = s("text", { x: cx, y: baseY + 16, "text-anchor": "middle" });
        lt.textContent = p[2] + "/" + p[1]; svg.appendChild(lt);
      }
    });
    svg.appendChild(s("line", { x1: esq, x2: larg, y1: baseY, y2: baseY, stroke: "var(--text2)", "stroke-opacity": ".4" }));
    box.insertBefore(svg, tip);
  }

  // ---------- Controles ----------
  Array.prototype.forEach.call(document.querySelectorAll("[data-periodo]"), function (b) {
    b.addEventListener("click", function () {
      var p = Number(b.getAttribute("data-periodo"));
      if (p === estado.periodo) return;
      estado.periodo = p;
      Array.prototype.forEach.call(document.querySelectorAll("[data-periodo]"), function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
      try { localStorage.setItem("painel-periodo", String(p)); } catch (e) {}
      carregar(false);
    });
  });
  var tBusca;
  $("busca").addEventListener("input", function (e) {
    clearTimeout(tBusca);
    tBusca = setTimeout(function () { estado.busca = e.target.value; estado.limite = 60; render(); }, 150);
  });
  $("atualizar").addEventListener("click", function () { carregar(true); });
  $("conta").addEventListener("change", function (e) {
    estado.conta = e.target.value; estado.limite = 60; estado.aberto = null;
    try { localStorage.setItem("painel-conta", estado.conta); } catch (er) {}
    render();
  });
  try { estado.conta = localStorage.getItem("painel-conta") || ""; } catch (er) {}
  var ultLarg = 0;
  window.addEventListener("resize", function () { var w = $("grafico").clientWidth; if (Math.abs(w - ultLarg) > 8) { ultLarg = w; agendar(); } });
  $("mais").addEventListener("click", function () { estado.limite += 60; render(); });

  try {
    var salvo = Number(localStorage.getItem("painel-periodo"));
    if ([7, 14, 30].indexOf(salvo) >= 0) {
      estado.periodo = salvo;
      Array.prototype.forEach.call(document.querySelectorAll("[data-periodo]"), function (o) {
        o.setAttribute("aria-pressed", Number(o.getAttribute("data-periodo")) === salvo ? "true" : "false");
      });
    }
  } catch (e) {}

  var DIAS_SEM = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  var MESES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
  function relogio() {
    var d = new Date(), z = function (n) { return String(n).padStart(2, "0"); };
    $("data-hoje").textContent = DIAS_SEM[d.getDay()] + " · " + z(d.getDate()) + " " + MESES[d.getMonth()] + " " + d.getFullYear();
    $("relogio").textContent = z(d.getHours()) + ":" + z(d.getMinutes()) + ":" + z(d.getSeconds());
    var falta = Math.max(0, Math.ceil((proxima - Date.now()) / 1000));
    $("auto").textContent = !mcp || !proxima ? "" : (verificando || estado.carregando) ? "Buscando novos" : "Nova busca em " + falta + "s";
    if (mcp && proxima && Date.now() >= proxima) verificarNovos();
  }
  relogio(); setInterval(relogio, 1000);

  // ---------- Tela cheia ----------
  function elCheio() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  var querCheia = false;
  function entrarCheia() {
    var raiz = document.documentElement, pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
    if (!pedir) { semTelaCheia(); return; }
    try {
      var pr = pedir.call(raiz);
      if (pr && typeof pr.catch === "function") pr.catch(function () { if (!querCheia) semTelaCheia(); });
    } catch (e) { semTelaCheia(); }
  }
  function atualizarTelaCheia() {
    var on = !!elCheio(), b = $("telacheia");
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.textContent = on ? "✕ Sair da tela cheia" : "⛶ Tela cheia";
    agendar();
  }

  function semTelaCheia() {
    aviso("Este aparelho não permite tela cheia por aqui. No computador, use o Chrome, o Edge ou o Safari; no app do Claude, use F11 (Windows) ou Ctrl+Cmd+F (Mac).", null);
  }
  $("telacheia").addEventListener("click", function () {
    try {
      if (elCheio()) {
        querCheia = false;
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
    } catch (e) {}
    querCheia = true;
    entrarCheia();
  });
  document.addEventListener("fullscreenchange", atualizarTelaCheia);
  document.addEventListener("webkitfullscreenchange", atualizarTelaCheia);
  document.addEventListener("keydown", function (e) {
    if ((e.key === "f" || e.key === "F") && !/INPUT|SELECT|TEXTAREA/.test((e.target && e.target.tagName) || "")) $("telacheia").click();
  });

  render();

  // ---------- Início ----------
  var claude = window.claude;
  if (!claude || typeof claude.use !== "function") {
    $("atualizar").disabled = true;
    aviso("Abra este painel no claude.ai para ler o seu Gmail.", null);
    $("status").textContent = "Sem acesso ao Gmail nesta visualização";
    return;
  }
  claude.use("mcp").then(function (m) {
    mcp = m;
    if (!mcp) {
      $("atualizar").disabled = true;
      aviso("Este painel só lê o Gmail quando aberto no claude.ai, com a sua conta.", null);
      $("status").textContent = "Sem acesso ao Gmail nesta visualização";
      return;
    }
    carregar(false);
  });
  function iniciarVoz() {
    Promise.all([claude.use("tts"), claude.use("permissions")]).then(function (r) {
      var t = r[0]; permissoes = r[1];
      if (t) {
        tts = t; modoVoz = "claude";
        try { t.onState(function (ev) { $("app").classList.toggle("falando", ev && ev.state === "speaking"); }); } catch (e) {}
        atualizarBotaoVoz();
        return;
      }
      var st = permissoes && permissoes.state ? permissoes.state("tts").catch(function () { return "unavailable"; }) : Promise.resolve("unavailable");
      return st.then(function (estadoTts) {
        if (estadoTts === "denied") modoVoz = "negada";
        else modoVoz = temVozNavegador ? "navegador" : "nenhuma";
        atualizarBotaoVoz();
      });
    }).catch(function () { modoVoz = temVozNavegador ? "navegador" : "nenhuma"; atualizarBotaoVoz(); });
  }
  atualizarBotaoVoz();
  iniciarVoz();
  Promise.all([claude.use("db"), claude.use("user")]).then(function (r) {
    db = r[0];
    var user = r[1];
    if (!db || !user) return;
    return user.id().then(function (id) { uid = id; iniciarCorrecoes(); agendar(); });
  }).catch(function () {});
})();
</script>
